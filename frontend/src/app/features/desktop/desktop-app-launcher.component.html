<section class="launcher" [attr.aria-label]="'desktop.launcher' | transloco">
  <div class="app-groups">
    @for (group of groups(); track group.id) {
      <section class="app-group" [attr.data-group]="group.id" [attr.aria-label]="group.label | transloco">
        <h3>{{ group.label | transloco }}</h3>
        <div class="app-grid">
          @for (app of group.apps; track app.id) {
            <a class="app-shortcut" [attr.data-testid]="'desktop-app-' + app.id" [attr.aria-label]="app.label | transloco"
               [attr.data-group]="group.id" [href]="app.route" (click)="launch.emit({ event: $event, route: app.route })">
              <span class="app-icon"><mat-icon aria-hidden="true">{{ app.icon }}</mat-icon></span>
              <span class="app-label">{{ app.label | transloco }}</span>
            </a>
          }
        </div>
      </section>
    }
  </div>
</section>
