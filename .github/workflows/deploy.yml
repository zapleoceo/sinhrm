name: Deploy

# Deploys only after CI is green: preview for pull requests, production for main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

jobs:
  deploy:
    # Public repo: never run PR code with secrets unless the branch lives in this repository (no forks).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ github.event.workflow_run.head_sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.4", extensions: "intl, sodium" }
      - run: npm i -g vercel@latest

      - name: API — build & deploy
        id: api
        working-directory: backend
        env: { VERCEL_PROJECT_ID: "${{ secrets.VERCEL_PROJECT_ID_API }}" }
        run: |
          PROD=$([ "$TARGET" = production ] && echo --prod || true)
          vercel pull --yes --environment=$TARGET --token=${{ secrets.VERCEL_TOKEN }}
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
          vercel build $PROD --token=${{ secrets.VERCEL_TOKEN }}
          url=$(vercel deploy --prebuilt $PROD --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: API — migrations via /api/ops/migrate (DB credentials stay in Vercel)
        working-directory: backend
        env:
          OPS_SECRET: "${{ secrets.OPS_SECRET }}"
          API_URL: "${{ steps.api.outputs.url }}"
        run: |
          # Step outputs reach the shell only through env (never spliced into the script text).
          [[ "$API_URL" =~ ^https://[a-z0-9-]+\.vercel\.app$ ]] || { echo "bad API url"; exit 1; }
          # Preview DB holds synthetic data only → rebuild it on every deploy; production → apply pending.
          Q=$([ "$TARGET" = preview ] && echo '?fresh=1' || true)
          out=$(curl -sS -m 90 -X POST "$API_URL/api/ops/migrate$Q" -H "X-Ops-Secret: $OPS_SECRET" -H "Accept: application/json" || true)
          # Log only the verdict: raw migration output stays out of public Actions logs.
          echo "$out" | grep -q '"ok":true' && echo "migrations: ok" || { echo "migrations: FAILED"; exit 1; }

      - name: Web — build & deploy
        id: web
        working-directory: frontend
        env:
          VERCEL_PROJECT_ID: "${{ secrets.VERCEL_PROJECT_ID_WEB }}"
          API_URL: "${{ steps.api.outputs.url }}"
        run: |
          PROD=$([ "$TARGET" = production ] && echo --prod || true)
          vercel pull --yes --environment=$TARGET --token=${{ secrets.VERCEL_TOKEN }}
          # Preview web must talk to the preview API of the same PR, not to prod: rewrite the /api and /sanctum
          # destinations in vercel.json (only in this CI checkout; the committed file keeps the prod URL).
          [[ "$API_URL" =~ ^https://[a-z0-9-]+\.vercel\.app$ ]] || { echo "bad API url"; exit 1; }
          if [ "$TARGET" = preview ]; then
            node -e '
              const fs = require("fs");
              const api = (process.argv[1] || "").replace(/\/+$/, "");
              if (!/^https:\/\/[a-z0-9.-]+\.vercel\.app$/i.test(api)) { console.error("bad preview API url"); process.exit(1); }
              const cfg = JSON.parse(fs.readFileSync("vercel.json", "utf8"));
              let n = 0;
              for (const r of cfg.rewrites) {
                for (const p of ["/api/", "/sanctum/"]) {
                  if (r.source === p + ":path*") { r.destination = api + p + ":path*"; n++; }
                }
              }
              if (n !== 2) { console.error("expected 2 rewrites, got " + n); process.exit(1); }
              fs.writeFileSync("vercel.json", JSON.stringify(cfg, null, 2) + "\n");
            ' "$API_URL"
            grep -c "$API_URL" vercel.json
          fi
          vercel build $PROD --token=${{ secrets.VERCEL_TOKEN }}
          url=$(vercel deploy --prebuilt $PROD --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke — /api/health
        id: smoke
        working-directory: backend
        env:
          API_URL: "${{ steps.api.outputs.url }}"
        run: |
          [[ "$API_URL" =~ ^https://[a-z0-9-]+\.vercel\.app$ ]] || { echo "bad API url"; exit 1; }
          out=$(curl -sS -m 60 "$API_URL/api/health" 2>&1 || true)
          echo "$out"
          { echo 'body<<EOF'; echo "$out"; echo 'EOF'; } >> "$GITHUB_OUTPUT"
          echo "$out" | grep -q '"ok":true'

      - name: Comment preview links on PR
        if: env.TARGET == 'preview' && always()
        uses: actions/github-script@v9
        env:
          WEB_URL: ${{ steps.web.outputs.url }}
          API_URL: ${{ steps.api.outputs.url }}
          SMOKE: ${{ steps.smoke.outputs.body }}
        with:
          script: |
            const prs = context.payload.workflow_run.pull_requests;
            if (!prs.length) return;
            const { WEB_URL, API_URL, SMOKE } = process.env;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: prs[0].number,
              body: ['### Preview', `- Web: ${WEB_URL}`, `- API: ${API_URL}`, '', '**Smoke `/api/health`:**', '```', SMOKE, '```'].join('\n'),
            });
