name: Night window guard

# Optional weekly guard (NOT a required check, not part of ci.yml): runs the backend phpunit suite with the
# clock faked to 22:30 UTC = 01:30 Kyiv, the window where UTC date != Kyiv date. Catches UTC-vs-Kyiv date bugs
# (incident 2026-10-02/03, AssetsApiTest) before they turn main red at night. MySQL (service container) keeps real time — fine.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  # Self-check: runs on PRs that touch this file (a new workflow cannot be dispatched before it is on main).
  pull_request:
    paths: [".github/workflows/night-window.yml"]

permissions:
  contents: read

jobs:
  night-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: backend } }
    services:
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: app_test, MYSQL_USER: app, MYSQL_PASSWORD: app }
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -proot" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: app_test
      DB_USERNAME: app
      DB_PASSWORD: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with: { php-version: "8.4", extensions: "pdo_mysql, intl, sodium", coverage: none }
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: sudo apt-get install -y --no-install-recommends faketime
      - name: Tests at 2026-10-15 22:30:00 UTC (01:30 Kyiv next day)
        run: |
          faketime -f '@2026-10-15 22:30:00' php -r 'echo gmdate("c"), PHP_EOL;'
          faketime -f '@2026-10-15 22:30:00' php artisan test
