name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Backend is split into parallel jobs; `backend` below is the aggregator whose name the "Protect main"
  # ruleset requires. Never rename `backend` (or the other required checks) — see docs/guides/deploy.md.
  lint:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # MySQL 8.4 only (ADR 0011): no mention of the former database outside the one-off cutover tool (Core/Transfer).
      - name: MySQL-only guard
        working-directory: .
        run: node --test scripts/mysql-only-guard.test.mjs && node scripts/mysql-only-guard.mjs
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with: { php-version: "8.4", extensions: "pdo_mysql, intl, sodium", coverage: none }
      # The only job that saves the vendor cache (tests / api-docs only restore it: api-docs prunes dev deps).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      # Pint and PHPStan result caches: new key every run (keys are immutable), restored by prefix.
      # Both tools validate their cache against file hashes + config, so a stale cache only costs time.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/pint.cache
            /tmp/phpstan
          key: lint-${{ hashFiles('backend/composer.lock') }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            lint-${{ hashFiles('backend/composer.lock') }}-${{ github.ref_name }}-
            lint-${{ hashFiles('backend/composer.lock') }}-
      - name: Pint (code style)
        run: vendor/bin/pint --test --parallel --cache-file=/tmp/pint.cache
      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  # MySQL 8.4 — the only supported database (ADR 0011). Required through the `backend` aggregator.
  tests:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services: &mysql
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: app_test, MYSQL_USER: app, MYSQL_PASSWORD: app }
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -proot" --health-interval 5s --health-timeout 5s --health-retries 10
    env: &mysqlenv
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: app_test
      DB_USERNAME: app
      DB_PASSWORD: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with: { php-version: "8.4", extensions: "pdo_mysql, intl, sodium", coverage: pcov }
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - name: Verify MySQL 8.4 test connection
        run: |
          test -z "${DB_URL:-}" && test -z "${DATABASE_URL:-}"
          php -r 'require "vendor/autoload.php"; $app = require "bootstrap/app.php"; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); $db = Illuminate\Support\Facades\DB::connection(); $version = (string) $db->selectOne("SELECT VERSION() AS version")->version; if ($db->getDriverName() !== "mysql" || !str_starts_with($version, "8.4.")) { fwrite(STDERR, "Unexpected MySQL test driver/version\n"); exit(1); } echo "MySQL 8.4 connection verified\n";'
      - name: Tests + coverage (min 70%)
        run: php artisan test --coverage --min=70

  api-docs:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services: *mysql
    env: *mysqlenv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with: { php-version: "8.4", extensions: "pdo_mysql, intl, sodium", coverage: none }
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - name: OpenAPI spec (Scramble) — must build without errors
        run: |
          php artisan migrate --force --quiet
          php -d memory_limit=1G artisan scramble:export --path=openapi.json
          php -r '$s=json_decode(file_get_contents("openapi.json"),true); $n=0; foreach($s["paths"] as $p){foreach($p as $o){if(is_array($o)&&isset($o["operationId"])){$n++;}}} echo "paths: ".count($s["paths"]).", operations: $n\n"; exit($n>0?0:1);'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: openapi, path: backend/openapi.json, retention-days: 30 }
      - name: Production bundle size (< 200 MB)
        run: |
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --quiet
          size=$(du -sm vendor | cut -f1); echo "vendor: ${size}MB"; test "$size" -lt 200

  # Required status check "backend" (ruleset "Protect main"): green only if every backend part succeeded.
  # always(): must report even when a part failed/was cancelled, so a PR never waits on a missing check.
  backend:
    if: always()
    needs: [lint, tests, api-docs]
    runs-on: ubuntu-latest
    steps:
      - env:
          LINT: ${{ needs.lint.result }}
          TESTS: ${{ needs.tests.result }}
          API_DOCS: ${{ needs['api-docs'].result }}
        run: |
          echo "lint=$LINT tests=$TESTS api-docs=$API_DOCS"
          [ "$LINT" = success ] && [ "$TESTS" = success ] && [ "$API_DOCS" = success ]

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx ng lint
      # Coverage floor = measured 02.10.2026 minus a margin (thresholds in angular.json → test.options.coverageThresholds;
      # statements 47.6 → 45.5). Without --coverage (local runs) thresholds are not checked.
      - name: Unit tests + coverage (thresholds in angular.json)
        run: npx ng test --watch=false --coverage
      - run: npm run test:docs
      - run: npm run build

  # UI parity harness (docs/guides/ui-parity.md): production build + mock API from committed fixtures; inventory,
  # errors, layout, axe and flow checks. NOT a required check yet — the owner adds it to "Protect main" once stable.
  # Builds on its own (in parallel with `frontend`) instead of waiting for that job's artifact.
  ui-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run e2e:lint
      - run: npm run build
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run e2e
        env: { E2E_SCREENSHOTS: "1" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with: { name: ui-parity-report, path: frontend/e2e/.out/report, retention-days: 14 }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: ui-parity-screens, path: frontend/e2e/.out/screens, retention-days: 7, if-no-files-found: ignore }

  extension:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: extension } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm, cache-dependency-path: extension/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: sinhrm-clipper, path: extension/dist/sinhrm-clipper.zip, retention-days: 30 }

  # Secrets + vulnerable dependencies (docs/architecture/secrets.md). gitleaks-action scanned only the last commit
  # on push (--log-opts=-1), so the binary is used directly: the WHOLE history on every run, pinned by sha256.
  security:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: gitleaks — full git history
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          echo "commits in history: $(git rev-list --all --count)"
          # --all: every fetched branch and tag, not only the history of the checked-out commit.
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --config .gitleaks.toml --exit-code 1 --log-opts="--all" .
      - name: composer audit (backend, from composer.lock)
        working-directory: backend
        run: composer audit --locked --no-interaction
      - name: npm audit (frontend, extension; high and above fail)
        run: |
          for d in frontend extension; do
            echo "== $d"; (cd "$d" && npm audit --package-lock-only --audit-level=high)
          done

  # Required check `docs` (name is fixed by the ruleset). Code of a module changed → its docs/modules page changed for real
  # (not a whitespace edit) and a test in the same module/feature changed. Rules: scripts/pr-checks-lib.mjs.
  # Exempt from tests: label no-tests-needed (read live, Re-run after labelling) and dependabot.
  docs:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Tests of the checks
        run: node --test scripts/pr-checks.test.mjs
      - name: Build provenance tests
        run: node --test scripts/stamp-build.test.mjs
      - name: Docs updated with code
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/docs-check.mjs "origin/$BASE_REF"
      - name: Tests updated with code
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          PR_LABELS=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" --jq '[.labels[].name] | join(",")')
          export PR_LABELS
          node scripts/tests-check.mjs "origin/$BASE_REF"

  # Journal entry per PR: docs/worklog.d/<YYYY-MM-DD>-<slug>.md (see docs/worklog.d/README.md).
  # Exempt: label no-worklog, docs/ + .github/ only, dependabot. Labels are read live, so Re-run after labelling.
  worklog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - run: node --test scripts/worklog.test.mjs
      - name: Worklog fragment present and valid
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          PR_LABELS=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '[.labels[].name] | join(",")')
          export PR_LABELS
          node scripts/worklog-check.mjs "origin/$BASE_REF"
