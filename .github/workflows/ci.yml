name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: app_test
      DB_USERNAME: app
      DB_PASSWORD: app
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.4", extensions: "pdo_pgsql, pgsql, intl, sodium", coverage: pcov }
      - uses: actions/cache@v6
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - name: Pint (code style)
        run: vendor/bin/pint --test
      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - name: Tests + coverage (min 70%)
        run: php artisan test --coverage --min=70
      - name: OpenAPI spec (Scramble) — must build without errors
        run: |
          php artisan migrate --force --quiet
          php -d memory_limit=1G artisan scramble:export --path=openapi.json
          php -r '$s=json_decode(file_get_contents("openapi.json"),true); $n=0; foreach($s["paths"] as $p){foreach($p as $o){if(is_array($o)&&isset($o["operationId"])){$n++;}}} echo "paths: ".count($s["paths"]).", operations: $n\n"; exit($n>0?0:1);'
      - uses: actions/upload-artifact@v4
        with: { name: openapi, path: backend/openapi.json, retention-days: 30 }
      - name: Production bundle size (< 200 MB)
        run: |
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --quiet
          size=$(du -sm vendor | cut -f1); echo "vendor: ${size}MB"; test "$size" -lt 200

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx ng lint
      - run: npx ng test --watch=false
      - run: npm run test:docs
      - run: npm run build

  extension:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: extension } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm, cache-dependency-path: extension/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with: { name: sinhrm-clipper, path: extension/dist/sinhrm-clipper.zip, retention-days: 30 }

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  docs:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - run: bash scripts/docs-check.sh origin/${{ github.base_ref }}
