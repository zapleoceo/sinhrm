version: 2
updates:
  - { package-ecosystem: composer, directory: /backend, schedule: { interval: weekly } }
  - { package-ecosystem: npm, directory: /frontend, schedule: { interval: weekly }, ignore: [{ dependency-name: "typescript", update-types: ["version-update:semver-major"] }] }
  - { package-ecosystem: github-actions, directory: /, schedule: { interval: weekly } }
